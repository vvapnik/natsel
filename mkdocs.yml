site_name: natsel
site_description: Continuous product evolution by natural selection. LLMs breed the genes, live traffic does the selecting.
site_url: https://vvapnik.github.io/natsel/
repo_url: https://github.com/vvapnik/natsel
repo_name: vvapnik/natsel
edit_uri: edit/main/docs/
copyright: natsel · MIT License

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
  icon:
    logo: material/dna

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Why natsel: why.md
  - Concept:
      - Model: concept/model.md
      - natsel vs A/B testing: concept/vs-ab.md
      - Architecture: concept/architecture.md
      - Team workflow: concept/workflow.md
      - Risks and open questions: concept/risks.md
      - Glossary: concept/glossary.md
  - Guides:
      - guides/index.md
